[project]
name = "trippilot"
version = "0.1.0"
description = "TripPilot - 高德 MCP + 美团酒旅 Skill + pgvector 混合召回的智能旅行规划引擎"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langchain-mcp-adapters>=0.3.2",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "langchain-openai>=1.8.5",
    "langchain-deepseek>=1.2.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
src = ["src"]
